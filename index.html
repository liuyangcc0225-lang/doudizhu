<title>斗地主 · 幸运发牌版</title>
<!-- 单文件离线应用：可加到手机主屏，像 App 一样全屏运行 -->
<style>
/* ============================ 斗地主 · 幸运发牌版 ============================ */
:root{
  --felt-1:#0e7c56; --felt-2:#05513c; --felt-3:#03291f;
  --gold:#ffd76a; --gold-2:#c8992f;
  --cream:#fffaf0; --ink:#1d2226; --red:#d3382d;
  --line:rgba(255,255,255,.14);
  --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:var(--font);color:#fff;
  background:radial-gradient(1100px 640px at 50% -8%,#14664d 0%,#082a20 58%,#04110d 100%);
  display:flex;align-items:center;justify-content:center;padding:10px;
  -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;
}
button{font-family:inherit}
.app{
  position:relative;width:min(100%,1060px);height:min(100%,780px);min-height:600px;
  display:flex;flex-direction:column;gap:8px;padding:12px;
  border:2px solid rgba(255,214,106,.5);border-radius:26px;
  background:radial-gradient(ellipse at 50% 34%,var(--felt-1),var(--felt-2) 62%,var(--felt-3));
  box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 0 70px rgba(0,0,0,.35);
  overflow:hidden;
}

/* ------------------------------------------------------------------- 顶栏 */
.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-weight:900;letter-spacing:.5px;font-size:clamp(16px,2.6vw,22px);white-space:nowrap}
.brand em{font-style:normal;color:var(--gold)}
.hud .gap{flex:1}
.chip{
  font-size:12px;line-height:1;padding:7px 10px;border-radius:99px;
  background:rgba(0,0,0,.28);border:1px solid var(--line);color:#ffeec2;white-space:nowrap;
}
.chip b{color:var(--gold);font-size:13px}
.icon-btn{
  width:34px;height:34px;border-radius:11px;cursor:pointer;font-size:15px;
  background:rgba(0,0,0,.28);border:1px solid var(--line);color:#fff;transition:.15s;
}
.icon-btn:hover{background:rgba(255,255,255,.12)}
.icon-btn.off{opacity:.45}

/* ------------------------------------------------------------------- 牌桌 */
.board{
  flex:1;min-height:0;display:grid;gap:8px;
  grid-template-columns:minmax(112px,1fr) minmax(0,1.45fr) minmax(112px,1fr);
  grid-template-rows:auto 1fr;
}
.seat{
  grid-row:1;background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:14px;
  padding:8px 6px;text-align:center;transition:.2s;min-width:0;
}
.seat.left{grid-column:1}
.seat.right{grid-column:3}
.seat.active{border-color:rgba(255,214,106,.85);box-shadow:0 10px 22px rgba(0,0,0,.4)}
.seat .who{font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;gap:5px}
.seat .count{font-size:12px;color:#cfe9dd;margin-top:3px}
.lord-tag{
  display:inline-block;font-size:10px;font-weight:800;color:#4a3100;background:linear-gradient(#ffe08a,#efb93a);
  border-radius:99px;padding:2px 7px;vertical-align:middle;
}
.lord-tag.hide{display:none}
.backs{display:flex;justify-content:center;margin-top:7px;min-height:30px}
.back{
  width:19px;height:27px;border-radius:4px;margin-left:-10px;overflow:hidden;
  background:#8a6420;box-shadow:-1px 0 0 rgba(0,0,0,.45),0 2px 5px rgba(0,0,0,.4);
}
.back svg{display:block;width:100%;height:100%}
.back:first-child{margin-left:0}

.center{
  grid-column:2;grid-row:1 / span 2;position:relative;display:flex;flex-direction:column;
  justify-content:center;gap:6px;min-width:0;padding:6px 2px;
}
.piles{display:flex;gap:8px;width:100%;justify-content:space-between}
.pile{flex:1;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:3px;min-height:46px}
.status{text-align:center;font-weight:800;color:#fff6d9;font-size:14px;min-height:20px}
.substatus{text-align:center;font-size:12px;color:#bfe2d3;min-height:16px}
.bottom-cards{display:flex;align-items:center;justify-content:center;gap:4px;min-height:40px}
.bc-label{font-size:11px;color:#cfe9dd;margin-right:2px}

/* --------------------------------------------------------------- 我的手牌 */
.me{background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:16px;padding:8px 10px 10px}
.me-head{display:flex;align-items:center;gap:8px;font-size:13px;color:#d8efe4;margin-bottom:2px;flex-wrap:wrap}
.me-head .who{font-weight:800;color:#fff;font-size:14px}
.me-head .gap{flex:1}
.lucky{font-size:11px;color:#ffe6a1;background:rgba(0,0,0,.3);border:1px solid rgba(255,214,106,.35);border-radius:99px;padding:3px 9px}
.hand{
  display:flex;align-items:flex-end;justify-content:center;padding:24px 4px 6px;
  min-height:128px;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;
}
.hand.shake{animation:shake .3s}
.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.btn{
  border:0;border-radius:12px;padding:10px 18px;font-size:14px;font-weight:800;cursor:pointer;
  background:#e9f3ee;color:#0f4534;box-shadow:0 2px 4px rgba(0,0,0,.22),0 8px 16px rgba(0,0,0,.16);transition:transform .16s var(--e1),filter .2s var(--e2),box-shadow .2s var(--e2);
}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(1px);box-shadow:0 1px 2px rgba(0,0,0,.22)}
.btn:disabled{opacity:.38;cursor:not-allowed;filter:grayscale(.5)}
.btn.primary{background:linear-gradient(#ffe28f,#f0b938);color:#4a3000}
.btn.ghost{background:rgba(255,255,255,.14);color:#eafff6}
.btn.ghost.on{background:linear-gradient(#9fe6c4,#4fc48f);color:#05352a}
.btn.small{padding:7px 12px;font-size:13px}

/* ----------------------------------------------------------------- 扑克牌 */
.card{
  position:relative;flex:0 0 auto;padding:0;cursor:pointer;
  width:clamp(30px,4.6vw,48px);height:clamp(62px,9.6vw,98px);
  background:linear-gradient(160deg,#fffdf7,#efe8d9);color:var(--ink);
  border:1px solid #cfc7b6;border-radius:8px;
  box-shadow:0 4px 9px rgba(0,0,0,.45);
  display:flex;align-items:center;justify-content:center;font-weight:800;
  transition:transform .2s var(--e1),box-shadow .2s var(--e2),border-color .2s var(--e2);
}
.card:first-child{margin-left:0}
.hand .card{margin-left:clamp(-17px,-2.2vw,-6px)}
.card.red{color:var(--red)}
.card .rank{position:absolute;top:3px;left:4px;font-size:clamp(12px,1.75vw,17px);line-height:1}
.card .suit{position:absolute;top:clamp(15px,2.3vw,22px);left:5px;font-size:clamp(10px,1.4vw,13px);line-height:1}
.card .big{font-size:clamp(17px,3.1vw,29px);line-height:1;opacity:.92}
.card.joker .rank{writing-mode:vertical-rl;font-size:10px;top:4px;left:3px;letter-spacing:-1px}
.card.joker .suit{top:auto;bottom:4px;left:4px}
.card.joker .big{font-size:clamp(13px,2.2vw,19px)}

<script>
/* =========================================================================
   斗地主核心引擎 —— 纯逻辑、零 DOM 依赖，浏览器与 Node 均可运行
   规则：54 张牌 / 叫分抢地主 / 底牌 / 单张·对子·三张·三带一·三带二 /
        顺子·连对·飞机（带单·带对）·四带二·四带两对 / 炸弹·王炸 /
        炸弹翻倍 / 春天翻倍
   ========================================================================= */
var DDZ = (function () {
  'use strict';

  var SUITS = ['♠', '♥', '♣', '♦'];
  var RANK_LABEL = { 3: '3', 4: '4', 5: '5', 6: '6', 7: '7', 8: '8', 9: '9', 10: '10', 11: 'J', 12: 'Q', 13: 'K', 14: 'A', 15: '2', 16: '小王', 17: '大王' };
  var COMBO_LABEL = {
    single: '单张', pair: '对子', triple: '三张', triple1: '三带一', triple2: '三带二',
    straight: '顺子', pairchain: '连对', plane: '飞机', plane1: '飞机带单', plane2: '飞机带对',
    four2: '四带二', four22: '四带两对', bomb: '炸弹', rocket: '王炸'
  };

  /* ------------------------------------------------------------- 基础工具 */
  function makeDeck() {
    var d = [];
    for (var r = 3; r <= 15; r++) for (var i = 0; i < 4; i++) d.push({ r: r, s: SUITS[i], id: r + SUITS[i] });
    d.push({ r: 16, s: '', id: 'JOKER16' });
    d.push({ r: 17, s: '', id: 'JOKER17' });
    return d;
  }

  function shuffle(arr, rnd) {
    rnd = rnd || Math.random;
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(rnd() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function sortCards(cards) {
    return cards.slice().sort(function (a, b) {
      return a.r - b.r || SUITS.indexOf(a.s) - SUITS.indexOf(b.s);
    });
  }

  function rankMap(cards) {
    var m = new Map();
    for (var i = 0; i < cards.length; i++) m.set(cards[i].r, (m.get(cards[i].r) || 0) + 1);
    return m;
  }

  function groupCards(cards) {
    var m = new Map();
    sortCards(cards).forEach(function (c) {
      if (!m.has(c.r)) m.set(c.r, []);
      m.get(c.r).push(c);
    });
    return m;
  }

  function removeCards(hand, cards) {
    var ids = new Set(cards.map(function (c) { return c.id; }));
    return hand.filter(function (c) { return !ids.has(c.id); });
  }

  function atCount(cnt, k) {
    var out = [];
    cnt.forEach(function (v, r) { if (v === k) out.push(r); });
    return out.sort(function (a, b) { return a - b; });
  }

  function isRun(ranks) {
    if (!ranks.length) return false;
    if (ranks[0] < 3 || ranks[ranks.length - 1] > 14) return false;
    for (var i = 1; i < ranks.length; i++) if (ranks[i] !== ranks[i - 1] + 1) return false;
    return true;
  }

  function longestRun(ranks, minLen) {
    var best = null, cur = [];
    for (var i = 0; i < ranks.length; i++) {
      if (cur.length && ranks[i] === cur[cur.length - 1] + 1) cur.push(ranks[i]); else cur = [ranks[i]];
      if (cur.length >= minLen && (!best || cur.length > best.length)) best = cur.slice();
    }
    return best;
  }

  /* ------------------------------------------------------------- 飞机识别 */
  function planeCombo(cnt, n) {
    var triples = atCount(cnt, 3);
    if (triples.length < 2) return null;
    var runs = [], cur = [];
    for (var i = 0; i < triples.length; i++) {
      if (cur.length && triples[i] === cur[cur.length - 1] + 1) cur.push(triples[i]);
      else { if (cur.length) runs.push(cur); cur = [triples[i]]; }
    }
    if (cur.length) runs.push(cur);
    var best = null;
    runs.forEach(function (run) {
      for (var m = run.length; m >= 2; m--) {
        for (var a = 0; a + m <= run.length; a++) {
          var core = run.slice(a, a + m);
          var coreSize = 3 * m;
          var type = null;
          if (n === coreSize) type = 'plane';
          else if (n === coreSize + m) type = 'plane1';
          else if (n === coreSize + 2 * m) type = 'plane2';
          if (!type) continue;
          if (type === 'plane2') {
            var ok = true, rest = 0;
            cnt.forEach(function (v, r) { if (core.indexOf(r) < 0) { rest += v; if (v !== 2) ok = false; } });
            if (!ok || rest !== 2 * m) continue;
          }
          if (!best || m > best.m) best = { type: type, power: core[core.length - 1], size: m, m: m };
        }
      }

  /* ------------------------------------------------------------- 牌型判定 */

    if (n === 2 && cnt.has(16) && cnt.has(17)) return T('rocket', 17, 1);

  /* --------------------------------------------------------------- 比大小 */
  function beats(c, prev) {

    if (prev.type === 'rocket') return false;
    if (c.type === 'bomb' && prev.type !== 'bomb') return true;

  /* --------------------------------------------------------- 候选牌型枚举 */
  function pickWings(g, pool, count, size, ways) {
    var out = [];
    var strict = pool.filter(function (r) { return g.get(r).length >= size && g.get(r).length !== 4; })
      .sort(function (a, b) { return (g.get(a).length - size) - (g.get(b).length - size) || a - b; });
    if (strict.length >= count) out.push(strict.slice(0, count).reduce(function (acc, r) { return acc.concat(g.get(r).slice(0, size)); }, []));
    if (ways > 1) {
      var loose = pool.slice().sort(function (a, b) { return (g.get(a).length - size) - (g.get(b).length - size) || a - b; })
        .filter(function (r) { return g.get(r).length >= size; });
      if (loose.length >= count) {
        var alt = loose.slice(0, count).reduce(function (acc, r) { return acc.concat(g.get(r).slice(0, size)); }, []);
        var key = alt.map(function (c) { return c.id; }).sort().join(',');
        if (out.every(function (o) { return o.map(function (c) { return c.id; }).sort().join(',') !== key; })) out.push(alt);
      }

  function enumerate(hand, prev) {
    var g = groupCards(hand);
    var ranks = [];
    g.forEach(function (v, r) { ranks.push(r); });
    ranks.sort(function (a, b) { return a - b; });
    var take = function (r, k) { return g.get(r).slice(0, k); };
    var raw = [];
    var push = function (cards) {
      var combo = classify(cards);
      if (combo) raw.push({ cards: sortCards(cards), combo: combo });
    };

    ranks.forEach(function (r) {
      var arr = g.get(r);
      push([arr[0]]);
      if (arr.length >= 2) push(arr.slice(0, 2));
      if (arr.length >= 3) push(arr.slice(0, 3));
      if (arr.length >= 4) push(arr.slice(0, 4));
    });
    if (g.has(16) && g.has(17)) push([g.get(16)[0], g.get(17)[0]]);

    ranks.forEach(function (r) {
      if (g.get(r).length < 3) return;
      var core = take(r, 3);
      var pool = ranks.filter(function (x) { return x !== r; });
      pool.forEach(function (k) { push(core.concat([g.get(k)[0]])); });
      pool.forEach(function (k) { if (g.get(k).length >= 2) push(core.concat(take(k, 2))); });
    });

    var sr = ranks.filter(function (r) { return r <= 14; });
    for (var i = 0; i < sr.length; i++) {
      for (var len = 5; i + len <= sr.length; len++) {
        var win = sr.slice(i, i + len);
        if (!isRun(win)) break;
        push(win.map(function (r) { return g.get(r)[0]; }));
      }
    }
    var pr = sr.filter(function (r) { return g.get(r).length >= 2; });
    for (var i2 = 0; i2 < pr.length; i2++) {
      for (var len2 = 3; i2 + len2 <= pr.length; len2++) {
        var win2 = pr.slice(i2, i2 + len2);
        if (!isRun(win2)) break;
        push(win2.reduce(function (acc, r) { return acc.concat(take(r, 2)); }, []));
      }
    }
    var tr = sr.filter(function (r) { return g.get(r).length >= 3; });
    for (var i3 = 0; i3 < tr.length; i3++) {
      for (var m = 2; i3 + m <= tr.length; m++) {
        var win3 = tr.slice(i3, i3 + m);
        if (!isRun(win3)) break;
        var core3 = win3.reduce(function (acc, r) { return acc.concat(take(r, 3)); }, []);
        push(core3);
        var wpool = ranks.filter(function (r) { return win3.indexOf(r) < 0; });
        pickWings(g, wpool, m, 1, 2).forEach(function (w) { push(core3.concat(w)); });

      pickWings(g, pool, 2, 1, 3).forEach(function (w) { push(core.concat(w)); });

    var seen = new Set(), out = [];

      var key = it.cards.map(function (c) { return c.id; }).sort().join(',');

      seen.add(key);
      if (prev && !beats(it.combo, prev)) continue;
      out.push(it);

    out.sort(function (a, b) { return a.combo.power - b.combo.power || a.cards.length - b.cards.length; });
    return out;
  }

  /* ------------------------------------------------------- 手牌结构评估 */
  function planCount(hand) {
    if (!hand.length) return 0;
    var left = {};
    hand.forEach(function (c) { left[c.r] = (left[c.r] || 0) + 1; });
    var plays = 0;
    var dec = function (r, k) { left[r] -= k; if (left[r] <= 0) delete left[r]; };
    var keys = function (need) {
      return Object.keys(left).map(Number).filter(function (r) { return r <= 14 && left[r] >= need; }).sort(function (a, b) { return a - b; });
    };
    if (left[16] && left[17]) { dec(16, 1); dec(17, 1); plays++; }
    var run;
    while ((run = longestRun(keys(1), 5))) { run.forEach(function (r) { dec(r, 1); }); plays++; }
    while ((run = longestRun(keys(2), 3))) { run.forEach(function (r) { dec(r, 2); }); plays++; }
    while ((run = longestRun(keys(3), 2))) { run.forEach(function (r) { dec(r, 3); }); plays++; }
    Object.keys(left).map(Number).forEach(function (r) { if (left[r] >= 4) { dec(r, 4); plays++; } });
    var rest = Object.keys(left).map(Number).sort(function (a, b) { return a - b; });
    var triples = rest.filter(function (r) { return left[r] >= 3; });
    var pairs = rest.filter(function (r) { return left[r] === 2; });
    var singles = rest.filter(function (r) { return left[r] === 1; });
    plays += triples.length;
    var kick = triples.length, i = 0, j = 0;
    while (kick > 0 && i < singles.length) { i++; kick--; }
    while (kick > 0 && j < pairs.length) { j++; kick--; }
    plays += (singles.length - i) + (pairs.length - j);
    return plays;
  }

  function breaksBomb(hand, cards) {
    var hc = rankMap(hand), sc = rankMap(cards), n = 0;
    hc.forEach(function (v, r) {
      var used = sc.get(r) || 0;
      if (v === 4 && used > 0 && used < 4) n++;

    return n;
  }

  function handStrength(hand) {
    var g = groupCards(hand), s = 0;
    g.forEach(function (arr, r) {
      if (r === 17) s += 4;
      else if (r === 16) s += 3;
      else if (r === 15) s += 1.6 * arr.length;
      else if (r === 14) s += 1.1 * arr.length;
      if (arr.length === 4) s += 3.2;
      if (arr.length === 3) s += 0.6;
    });
    if (g.has(16) && g.has(17)) s += 3;
    return s;
  }
  /* ------------------------------------------------------------------ AI */
  function aiChoose(st) {
    var hand = st.hand;
    if (!hand.length) return null;
    var prev = st.prev || null;
    var me = st.me, lord = st.landlord;
    var isPartner = function (i) { return me !== lord && i !== lord && i !== me; };
    var isFoe = function (i) { return me === lord ? i !== lord : i === lord; };
    var opts = enumerate(hand, prev);
    if (!opts.length) return null;
    var fin = opts.filter(function (o) { return o.cards.length === hand.length; });
    if (fin.length) return { cards: fin[0].cards };
    var base = planCount(hand);
    var known = st.revealedHand || null;   // 明牌后玩家手牌对对手公开
    var isFoeOfUser = isFoe(0);
    if (!prev) {
      var pool = opts;
      if (known && isFoeOfUser) {
        var safe = opts.filter(function (o) {
          return (o.combo.type !== 'bomb' && o.combo.type !== 'rocket') || !playerCanBomb(known, o.cards);
        });
        if (safe.length) pool = safe;
      }
      var best = pool.slice().sort(function (a, b) { return leadCost(a, hand) - leadCost(b, hand); })[0];
      return { cards: best.cards };
    }
    if (st.lastPlayer >= 0 && isPartner(st.lastPlayer)) return null;
    var urgent = st.lastPlayer >= 0 && isFoe(st.lastPlayer) && st.handCounts[st.lastPlayer] <= 2;
    var foeLow = [0, 1, 2].some(function (i) { return isFoe(i) && st.handCounts[i] <= 2; });
    var plain = opts.filter(function (o) { return o.combo.type !== 'bomb' && o.combo.type !== 'rocket'; });
    if (!plain.length) {
      var worth = urgent || foeLow || hand.length <= 5 || prev.power >= 14 || st.rnd() < 0.15;
      var bomb = opts.slice().sort(function (a, b) {
        return (a.combo.type === 'rocket' ? 1000 : a.combo.power) - (b.combo.type === 'rocket' ? 1000 : b.combo.power);
      })[0];
      if (known && isFoeOfUser && !urgent && playerCanBomb(known, bomb.cards)) worth = false;
      if (!worth) return null;

    }
    plain.sort(function (a, b) { return followCost(a, hand, base) - followCost(b, hand, base); });

    if (urgent) return { cards: pick.cards };
    var dmg = planCount(removeCards(hand, pick.cards)) - (base - 1);

  function leadCost(o, hand) {

    if (o.combo.type === 'rocket') c += 90;
    if (o.combo.type === 'single' && o.combo.power >= 15) c += 28;
    if (o.combo.type === 'pair' && o.combo.power >= 14) c += 12;

  function aiBidScore(g, actor) {

  /* AI 的叫地主 / 抢地主 决策 */

  /* 明牌后对手看得到你的手牌：判断你能否反手炸回去 */

    return hit;
  }

  /* ------------------------------------------------- 发牌：只给玩家发好牌 */
  var LUCKY_HANDS = [
    [17, 16, 15, 15, 15, 15, 14, 14, 14, 14, 3, 4, 5, 6, 7, 8, 9],
    [17, 16, 15, 15, 15, 15, 13, 13, 13, 13, 3, 4, 5, 6, 7, 8, 9],
    [17, 16, 14, 14, 14, 14, 13, 13, 13, 13, 3, 4, 5, 6, 7, 8, 9],
    [17, 16, 15, 15, 15, 15, 14, 14, 14, 12, 12, 12, 3, 4, 5, 6, 7],
    [17, 16, 15, 15, 15, 15, 12, 12, 12, 12, 3, 4, 5, 6, 7, 8, 10],
    [17, 16, 14, 14, 14, 14, 11, 11, 11, 11, 3, 4, 5, 6, 7, 8, 9]

  function describeHand(hand) {
    var g = groupCards(hand), parts = [];

    else { if (g.has(17)) parts.push('大王'); if (g.has(16)) parts.push('小王'); }
    g.forEach(function (arr, r) { if (arr.length === 4) parts.push(rankLabel(r) + '炸'); });
    var sr = [];
    g.forEach(function (v, r) { if (r <= 14) sr.push(r); });
    sr.sort(function (a, b) { return a - b; });
    var run = longestRun(sr, 5);

  function dealLucky(g) {
    var rnd = g.rnd;
    var deck = makeDeck();
    var template = LUCKY_HANDS[Math.floor(rnd() * LUCKY_HANDS.length)];
    var pool = new Map();
    deck.forEach(function (c) { if (!pool.has(c.r)) pool.set(c.r, []); pool.get(c.r).push(c); });
    var need = {};
    template.forEach(function (r) { need[r] = (need[r] || 0) + 1; });
    var mine = [];
    Object.keys(need).forEach(function (k) {
      var arr = shuffle(pool.get(Number(k)).slice(), rnd);

    var high = rest.slice().sort(function (a, b) { return b.r - a.r; }).slice(0, 9);

  /* ------------------------------------------------------------ 对局状态 */
  function createGame(opts) {
    opts = opts || {};
    var g = {

      names: opts.names || ['你', '对家小王', '对家老李'],
      hands: [[], [], []], bottom: [], tag: '',
      phase: 'bid', landlord: -1, bid: 1, caller: -1, robs: 0, revealed: false,
      bidOrder: [], bidIdx: 0, bidPass: 1, bidActions: 0, robThisPass: false, redeals: 0,
      turn: 0, lastPlay: null, lastPlayer: -1, passes: 0,

  }

  function redeal(g) {
    dealLucky(g);
    g.tag = describeHand(g.hands[0]);
    g.phase = 'bid'; g.landlord = -1; g.bid = 1;
    g.caller = -1; g.robs = 0; g.revealed = false;
    g.bidPass = 1; g.bidIdx = 0; g.bidActions = 0; g.robThisPass = false;
    g.lastPlay = null; g.lastPlayer = -1; g.passes = 0;

    g.turn = g.bidOrder[0];
    g.emit({ t: 'deal', hands: g.hands.map(function (h) { return h.slice(); }), bottom: g.bottom.slice(), tag: g.tag, starter: starter });
    g.emit({ t: 'turn', actor: g.turn });

  /* kind: 'call' = 叫地主或抢地主，'pass' = 不叫或不抢 */
  function bidAction(g, actor, kind) {
    if (g.over || g.phase !== 'bid') return { ok: false, msg: '现在不是叫地主阶段' };
    if (actor !== g.turn) return { ok: false, msg: '还没轮到你' };
    var rob = g.caller >= 0;
    if (kind === 'call') {
      if (rob && actor === g.caller) return { ok: false, msg: '自己不用抢自己' };
      g.caller = actor;
      if (rob) {
        g.robs++;
        g.multiplier *= 2;
        g.robThisPass = true;
      }
      g.emit({ t: 'bid', actor: actor, kind: rob ? 'rob' : 'call', robs: g.robs, multiplier: g.multiplier });
    } else {
      g.emit({ t: 'bid', actor: actor, kind: 'pass' });
    }
    advanceBid(g);
    return { ok: true };
  }

  /* 明牌：把手牌亮给对手，倍数翻倍（仅叫地主阶段可用） */
  function revealHand(g) {
    if (g.over || g.phase !== 'bid') return { ok: false, msg: '只能在叫地主阶段明牌' };
    if (g.revealed) return { ok: false, msg: '已经明牌了' };
    g.revealed = true;
    g.multiplier *= 2;
    g.emit({ t: 'reveal', actor: 0, multiplier: g.multiplier });
    return { ok: true };
  }

  function advanceBid(g) {
    g.bidIdx++;
    g.bidActions++;
    if (g.bidActions > 9) { endBidding(g); return; }
    if (g.bidIdx >= g.bidOrder.length) {
      if (g.bidPass === 1 && g.robs > 0) {
        g.bidPass = 2; g.bidIdx = 0; g.robThisPass = false;      // 进入抢回轮
      } else if (g.bidPass === 2 && g.robThisPass) {
        g.bidIdx = 0; g.robThisPass = false;                       // 有人抢，其他人再表态一次
      } else {
        endBidding(g); return;
      }
    }
    var next = g.bidOrder[g.bidIdx];

    g.turn = next;
    g.emit({ t: 'turn', actor: g.turn });
  }

  function endBidding(g) {
    if (g.caller < 0) {

        g.caller = pick; g.bid = 1;
        g.emit({ t: 'note', text: '无人叫地主，' + g.names[pick] + ' 以 1 分当地主' });

  function setLandlord(g, actor) {

    g.emit({ t: 'turn', actor: g.turn });
  }

  function playCards(g, actor, cards) {
    if (g.over || g.phase !== 'play' || actor !== g.turn) return { ok: false, msg: '还没轮到你出牌' };
    if (!cards || !cards.length) return { ok: false, msg: '请先选牌' };
    var combo = classify(cards);
    if (!combo) return { ok: false, msg: '这组牌不构成有效牌型' };
    var own = new Set(g.hands[actor].map(function (c) { return c.id; }));
    if (!cards.every(function (c) { return own.has(c.id); })) return { ok: false, msg: '手牌里没有这些牌' };
    if (g.lastPlay && g.lastPlayer !== actor && !beats(combo, g.lastPlay.combo)) {

    g.playedCount[actor]++;

    wrap.style.setProperty('--cw', cw.toFixed(1) + 'px');
    wrap.style.setProperty('--ch', (cw * 2.06).toFixed(1) + 'px');
    wrap.style.setProperty('--ml', (step - cw).toFixed(1) + 'px');
  }

  function updateSelection() {
    var kids = $('hand').children;
    for (var i = 0; i < kids.length; i++) {
      var on = state.sel.has(kids[i].dataset.id);
      kids[i].classList.toggle('on', on);
      kids[i].setAttribute('aria-pressed', on ? 'true' : 'false');
    }
    var info = $('pickInfo'), cards = selectedCards();
    if (!cards.length) { info.textContent = ''; info.classList.remove('bad'); return; }
    var combo = E.classify(cards);
    info.textContent = '已选 ' + cards.length + ' 张 · ' + (combo ? E.comboLabel(combo.type) : '牌型无效');
    info.classList.toggle('bad', !combo);
  }

  function renderPile(i) {
    var g = state.g, box = $('pile' + i), act = g.actions[i];
    cache.actions[i] = act;
    box.innerHTML = '';
    if (!act) return;
    if (act.type === 'pass') {
      var tag = document.createElement('span');
      tag.className = 'pass-tag';
      tag.textContent = '不要';
      box.appendChild(tag);
      return;
    }
    var org = pileOrigin(i);
    act.cards.forEach(function (c, k) {
      var el = cardNode(c, true);
      box.appendChild(el);
      var r = el.getBoundingClientRect();
      flyFrom(el, org.x - (r.left + r.width / 2), org.y - (r.top + r.height / 2), {
        duration: 300, delay: k * 24, scale: 0.68
      });
    });
  }

  function renderAll() {
    var g = state.g, i;
    if (!g) return;

    for (i = 1; i <= 2; i++) {
      $('count' + i).textContent = g.hands[i].length + ' 张';
      var n = Math.min(g.hands[i].length, 14);
      if (cache.backs[i - 1] !== n) {
        cache.backs[i - 1] = n;
        var box = $('backs' + i);
        box.innerHTML = '';
        for (var k = 0; k < n; k++) box.appendChild(backNode());
      }
      $('seat' + i).classList.toggle('active', !g.over && g.turn === i);
      $('seat' + i).classList.toggle('thinking', !g.over && g.phase === 'play' && g.turn === i);
      var tag = $('lord' + i);
      tag.classList.toggle('hide', g.landlord !== i);
    }

    $('count0').textContent = g.hands[0].length + ' 张';
    $('lordMe').classList.toggle('hide', g.landlord !== 0);

    /* 地主 / 农民 头像：身份确定后自动换装 */
    for (i = 0; i <= 2; i++) {
      var role = g.landlord === i ? 'lord' : 'farmer';
      if (cache.avatars[i] !== role) {
        cache.avatars[i] = role;
        var av = $('ava' + i);
        if (av) {
          av.innerHTML = avatarSVG(role, i);
          av.classList.toggle('lord', role === 'lord');
          av.setAttribute('title', role === 'lord' ? '地主' : '农民');
        }
      }
    }

    var hs = g.hands[0].map(function (c) { return c.id; }).join(',');
    if (hs !== cache.hand) { cache.hand = hs; cache.reveal = ''; renderHand(); }

    var bs = g.landlord < 0 ? 'hidden' : g.bottom.map(function (c) { return c.id; }).join(',');
    if (bs !== cache.bottom) {
      cache.bottom = bs;
      var bc = $('bottomCards');
      bc.innerHTML = '';
      var lab = document.createElement('span');
      lab.className = 'bc-label';
      lab.textContent = '底牌';
      bc.appendChild(lab);
      if (g.landlord < 0) {
        for (var q = 0; q < 3; q++) { var bb = backNode(); bb.style.marginLeft = '4px'; bc.appendChild(bb); }
      } else {
        g.bottom.forEach(function (c) { bc.appendChild(cardNode(c, true)); });
      }
    }

    for (i = 0; i < 3; i++) if (g.actions[i] !== cache.actions[i]) renderPile(i);

    var main, sub;
    if (g.over) {
      main = '本局结束';
      sub = '点下方「再来一局」继续';
    } else if (g.phase === 'bid') {
      main = g.turn === 0 ? (g.caller < 0 ? '轮到你叫地主' : '轮到你抢地主') : NAMES[g.turn] + ' 正在叫抢…';
      sub = g.caller < 0 ? '还没有人叫地主'
        : NAMES[g.caller] + ' 叫了地主' + (g.robs ? ' · 被抢 ' + g.robs + ' 次' : '')
          + ' · 倍数 ×' + g.multiplier + (g.revealed ? ' · 已明牌' : '');
    } else {
      main = g.turn === 0 ? '轮到你出牌' : NAMES[g.turn] + ' 正在思考…';
      sub = (g.landlord === 0 ? '你是地主' : NAMES[g.landlord] + ' 是地主')
        + (g.lastPlay ? ' · 桌面：' + NAMES[g.lastPlayer] + ' 出' + E.comboLabel(g.lastPlay.combo.type) : ' · 新的一轮');
    }
    $('status').textContent = main;
    $('substatus').textContent = sub;

    var myTurn = !g.over && g.phase === 'play' && g.turn === 0;
    $('playBtn').disabled = !myTurn;
    $('passBtn').disabled = !myTurn || !g.lastPlay;
    $('hintBtn').disabled = !myTurn;
    $('sortBtn').disabled = g.over;
    $('autoBtn').classList.toggle('on', state.auto);
    $('autoBtn').setAttribute('aria-pressed', state.auto ? 'true' : 'false');

    /* 明牌：叫地主阶段可亮牌，倍数 ×2 */
    var rb = $('revealBtn');
    rb.disabled = !(!g.over && g.phase === 'bid' && !g.revealed);
    rb.textContent = g.revealed ? '已明牌' : '明牌 ×2';
    rb.classList.toggle('on', !!g.revealed);
    rb.setAttribute('aria-pressed', g.revealed ? 'true' : 'false');
    $('revealChip').classList.toggle('hide', !g.revealed);
    $('app').classList.toggle('revealed', !!g.revealed);
    $('revealBox').classList.toggle('hide', !g.revealed);
    if (g.revealed) {
      var rsig = 'R' + g.hands[0].map(function (c) { return c.id; }).join(',');
      if (cache.reveal !== rsig) {
        cache.reveal = rsig;
        var rbox = $('revealBox');
        rbox.innerHTML = '';
        var rlab = document.createElement('span');
        rlab.className = 'rv-label';
        rlab.textContent = '明牌中 · 手牌公开';
        rbox.appendChild(rlab);
        g.hands[0].forEach(function (c) { rbox.appendChild(cardNode(c, true)); });
      }
    }

    $('hudBid').textContent = (g.bid || 1) + ' 分';
    $('hudMul').textContent = '×' + g.multiplier + (g.robs ? ' · 抢' + g.robs : '') + (g.revealed ? ' · 明牌' : '') + (g.bombs ? ' · ' + g.bombs + ' 炸' : '');
    if (state.shownTotal !== state.total) {
      var fromTotal = state.shownTotal || 0;
      state.shownTotal = state.total;
      countUp($('hudTotal'), fromTotal, state.total);
    }
    $('hudRate').textContent = state.wins + '/' + state.rounds;
    $('luckyTag').innerHTML = iconTagName('clover') + (g.tag || '好运');
  }

  /* --------------------------------------------------------- 交互动作 */
  /* ---------------- 手指（或鼠标）滑过手牌，连续批量选牌 ---------------- */
  var paint = null;   // { mode: true=选中 / false=取消, last: 上一张, moved: 是否真的拖过 }
  function handCardAt(x, y) {
    var el = document.elementFromPoint(x, y);
    if (!el || !el.closest) return null;
    var card = el.closest('.card');
    return (card && card.parentNode && card.parentNode.id === 'hand') ? card : null;
  }
  function setCardSelected(id, on) {
    var g = state.g;
    if (!g) return false;
    if (on === state.sel.has(id)) return false;
    if (!g.hands[0].some(function (c) { return c.id === id; })) return false;
    if (on) state.sel.add(id); else state.sel.delete(id);
    return true;
  }
  function onPaintStart(ev) {
    var g = state.g;
    if (!g || g.over || g.phase !== 'play' || g.turn !== 0) return;
    var card = ev.target && ev.target.closest ? ev.target.closest('.card') : null;
    if (!card || !card.parentNode || card.parentNode.id !== 'hand') return;
    var id = card.dataset.id;
    paint = { mode: !state.sel.has(id), last: id, moved: false, x: ev.clientX, y: ev.clientY };
    setCardSelected(id, paint.mode);
    updateSelection();
    sfx('tap');
    try { if (card.releasePointerCapture) card.releasePointerCapture(ev.pointerId); } catch (e) { /* 忽略 */ }
    $('hand').classList.add('dragging');
    if (ev.cancelable) ev.preventDefault();
  }
  function onPaintMove(ev) {
    if (!paint) return;
    if (!paint.moved && Math.abs(ev.clientX - paint.x) + Math.abs(ev.clientY - paint.y) > 5) paint.moved = true;
    var card = handCardAt(ev.clientX, ev.clientY);
    if (!card) return;
    var id = card.dataset.id;
    if (id !== paint.last) paint.last = id;
    if (setCardSelected(id, paint.mode)) updateSelection();
    if (ev.cancelable) ev.preventDefault();
  }
  function onPaintEnd() {
    if (!paint) return;
    paint = null;
    $('hand').classList.remove('dragging');
  }

  function toggleCard(id) {
    var g = state.g;
    if (!g || g.over || g.phase !== 'play' || g.turn !== 0) return;
    if (state.sel.has(id)) state.sel.delete(id); else state.sel.add(id);
    updateSelection();
    sfx('tap');
  }

  function selectedCards() {
    var g = state.g;
    return g.hands[0].filter(function (c) { return state.sel.has(c.id); });
  }

  function shakeHand() {
    var h = $('hand');
    h.classList.remove('bad');
    void h.offsetWidth;
    h.classList.add('bad');
  }

  function doPlay() {
    var g = state.g;
    if (!g || g.over || g.phase !== 'play' || g.turn !== 0) return;
    var cards = selectedCards();
    if (!cards.length) { toast('先点选要出的牌'); shakeHand(); return; }
    var r = E.humanPlay(g, cards);
    if (!r.ok) { toast(r.msg); shakeHand(); return; }
    state.sel.clear();
    renderAll();
    pump();
  }

  function doPass() {
    var g = state.g;
    if (!g || g.over || g.phase !== 'play' || g.turn !== 0) return;
    var r = E.humanPass(g);
    if (!r.ok) { toast(r.msg); return; }
    state.sel.clear();
    renderAll();
    pump();
  }

  function doHint() {
    var g = state.g;
    if (!g || g.over || g.phase !== 'play' || g.turn !== 0) return;
    var cards = E.hint(g);
    if (!cards) { toast('这轮没有能压过的牌，点「不要」吧'); return; }
    state.sel = new Set(cards.map(function (c) { return c.id; }));
    updateSelection();
    toast('提示：' + E.comboLabel(E.classify(cards).type));
  }

  function doSort() {
    var g = state.g;
    if (!g) return;
    g.hands[0] = E.sortCards(g.hands[0]);
    cache.hand = '';
    renderAll();
  }

  function toggleAuto() {
    state.auto = !state.auto;
    $('autoBtn').classList.toggle('on', state.auto);
    if (state.auto) { toast('已开启托管，电脑替我出牌'); pump(); }
    else toast('已关闭托管');
  }

  function onBid(kind) {
    var g = state.g;
    if (!g || g.over || g.phase !== 'bid' || g.turn !== 0) return;
    var r = E.humanBid(g, kind);
    if (!r.ok) { toast(r.msg); return; }
    hideBid();
    renderAll();
    pump();
  }

  function onReveal() {
    var g = state.g;
    if (!g) return;
    var r = E.humanReveal(g);
    if (!r.ok) { toast(r.msg); return; }
    renderAll();
  }

  /* ----------------------------------------------------------- 流程驱动 */
  function showBid() {
    var g = state.g;
    var rob = g.caller >= 0;
    $('bidCall').textContent = rob ? '抢地主 ×2' : '叫地主';
    $('bidPass').textContent = rob ? '不抢' : '不叫';
    $('bidCall').disabled = (g.caller === 0);
    $('bidTip').textContent = rob ? NAMES[g.caller] + ' 叫了地主' : '要不要当地主？';
    $('bidbar').classList.add('show');
  }
  function hideBid() { $('bidbar').classList.remove('show'); }

  function pump() {
    var token = ++state.token;
    (function step() {
      if (token !== state.token) return;
      var g = state.g;
      if (!g || g.over) return;

      if (g.phase === 'bid') {
        renderAll();
        if (g.turn === 0) { showBid(); if (state.auto) setTimeout(function () { if (token === state.token) autoBid(); }, 500); return; }
        hideBid();
        setTimeout(function () {
          if (token !== state.token) return;
          E.step(g);
          renderAll();
          step();
        }, 620);
        return;
      }

      hideBid();
      renderAll();
      if (g.turn === 0) {
        if (state.auto) setTimeout(function () { if (token === state.token) autoPlay(); }, 620);
        return;
      }
      setTimeout(function () {
        if (token !== state.token) return;
        E.step(g);
        renderAll();
        step();
      }, 480 + Math.random() * 460);
    })();
  }

  function autoBid() {
    var g = state.g;
    if (!g || g.over || g.phase !== 'bid' || g.turn !== 0) return;
    onBid(E.aiBidKind(g, 0));
  }

  function autoPlay() {
    var g = state.g;
    if (!g || g.over || g.phase !== 'play' || g.turn !== 0) return;
    var mv = E.aiChoose(E.aiState(g, 0));
    var r = (mv && mv.cards) ? E.humanPlay(g, mv.cards) : E.humanPass(g);
    if (!r.ok) E.humanPass(g);
    state.sel.clear();
    renderAll();
    pump();
  }

  /* --------------------------------------------------------------- 事件 */
  function onEvent(e) {
    if (e.t === 'deal') {
      state.dealAt = Date.now();
      cache.hand = ''; cache.backs = [-1, -1]; cache.bottom = ''; cache.actions = [null, null, null];
      cache.avatars = ['', '', '']; cache.reveal = '';
      state.sel.clear();
      $('pile0').innerHTML = ''; $('pile1').innerHTML = ''; $('pile2').innerHTML = '';
    } else if (e.t === 'play') {
      sfx(e.bomb ? 'boom' : 'play');
      if (e.bomb) flashTable();
    } else if (e.t === 'pass') {
      sfx('pass');
    } else if (e.t === 'bid') {
      if (e.kind === 'rob') { sfx('bid'); toast(NAMES[e.actor] + ' 抢地主！倍数 ×' + e.multiplier); }
      else if (e.kind === 'call') { sfx('bid'); toast(NAMES[e.actor] + ' 叫地主'); }
      else sfx('pass');
    } else if (e.t === 'reveal') {
      sfx('lord');
      toast('已明牌：手牌全公开，倍数 ×' + e.multiplier);
    } else if (e.t === 'landlord') {
      sfx('lord');
      toast((e.actor === 0 ? '你是地主' : NAMES[e.actor] + ' 是地主') + '（倍数 ×' + e.multiplier + '）' + (e.actor === 0 ? '，底牌已收下' : ''));
    } else if (e.t === 'note') {
      toast(e.text);
    } else if (e.t === 'over') {
      setTimeout(showResult, 750);
    }
  }

  /* --------------------------------------------------------------- 结算 */
  function showResult() {
    var g = state.g;
    if (!g || !g.result || state.overShown) return;
    state.overShown = true;
    var r = g.result;
    state.rounds++;
    if (r.humanWin) state.wins++;
    state.total += r.humanWin ? r.points : -r.points;
    saveStats();

    $('resTitle').innerHTML = r.humanWin
      ? iconTagName('trophy', 'ic res-ic') + '你赢了'
      : iconTagName('sad', 'ic res-ic lose') + '这局被抢走了';
    $('resPoints').textContent = (r.humanWin ? '+' : '−') + r.points;
    $('resPoints').style.color = r.humanWin ? '#0f7a52' : '#b03a2e';
    var lines = [];
    lines.push('身份：' + (g.landlord === 0 ? '地主' : '农民') + (r.spring ? '（' + (r.lordWon ? '春天' : '反春') + '）' : '') + ' · 底分 ' + r.bid + ' 分');
    var bits = [];
    if (r.robs) bits.push('抢地主 ×' + r.robs);
    if (r.revealed) bits.push('明牌 ×2');
    if (r.bombs) bits.push('炸弹 ×' + r.bombs);
    if (r.spring) bits.push('春天 ×2');
    lines.push((bits.length ? bits.join(' · ') + '<br>' : '') + '总倍数 <b>×' + r.multiplier + '</b>');
    lines.push('累计得分 <b>' + (state.total > 0 ? '+' : '') + state.total + '</b> · 战绩 ' + state.wins + '/' + state.rounds);
    var box = $('resLines');
    box.innerHTML = '';
    lines.forEach(function (txt) {
      var d = document.createElement('div');
      d.innerHTML = txt;
      box.appendChild(d);
    });
    $('overlay').classList.add('show');
    var panel = document.querySelector('.panel');
    if (reducedMotion()) {
      play(panel, [{ opacity: 0 }, { opacity: 1 }], { duration: 160, fill: 'backwards' });
    } else {
      play(panel, [
        { transform: 'translateY(14px) scale(.95)', opacity: 0, filter: 'blur(6px)' },
        { transform: 'none', opacity: 1, filter: 'blur(0px)' }
      ], { duration: 320, easing: EASE, fill: 'backwards' });
      var ic = panel.querySelector('.res-ic');
      if (ic) play(ic, [{ transform: 'scale(.5) rotate(-12deg)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 420, delay: 90, easing: EASE, fill: 'backwards' });
    }
    sfx(r.humanWin ? 'win' : 'lose');
    renderAll();
  }

  function loadStats() {
    try {
      var s = JSON.parse(localStorage.getItem('ddz_lucky_v1') || 'null');
      if (s) { state.total = s.total | 0; state.rounds = s.rounds | 0; state.wins = s.wins | 0; }
      state.shownTotal = state.total;
    } catch (err) {}
  }
  function saveStats() {
    try { localStorage.setItem('ddz_lucky_v1', JSON.stringify({ total: state.total, rounds: state.rounds, wins: state.wins })); } catch (err) {}
  }

  /* --------------------------------------------------------------- 启动 */
  function newGame() {
    state.sel.clear();
    state.overShown = false;
    $('overlay').classList.remove('show');
    cache.hand = ''; cache.backs = [-1, -1]; cache.bottom = ''; cache.actions = [null, null, null];
    cache.avatars = ['', '', '']; cache.reveal = '';
    state.g = E.createGame({ names: NAMES, onEvent: onEvent });
    renderAll();
    pump();
  }

  function bind() {
    $('playBtn').addEventListener('click', doPlay);
    $('passBtn').addEventListener('click', doPass);
    $('hintBtn').addEventListener('click', doHint);
    $('sortBtn').addEventListener('click', doSort);
    $('autoBtn').addEventListener('click', toggleAuto);
    $('newBtn').addEventListener('click', newGame);
    $('againBtn').addEventListener('click', newGame);
    $('closeBtn').addEventListener('click', function () { $('overlay').classList.remove('show'); });
    $('bidCall').addEventListener('click', function () { onBid('call'); });
    $('bidPass').addEventListener('click', function () { onBid('pass'); });
    $('revealBtn').addEventListener('click', onReveal);
    $('soundBtn').addEventListener('click', function () {
      state.sound = !state.sound;
      $('soundBtn').innerHTML = iconTagName(state.sound ? 'sound' : 'mute');
      $('soundBtn').classList.toggle('off', !state.sound);
      $('soundBtn').setAttribute('aria-pressed', state.sound ? 'true' : 'false');
      if (state.sound) sfx('tap');
    });
    var hand = $('hand');
    hand.addEventListener('pointerdown', onPaintStart);
    hand.addEventListener('pointermove', onPaintMove);
    hand.addEventListener('pointerup', onPaintEnd);
    hand.addEventListener('pointercancel', onPaintEnd);
    hand.addEventListener('pointerleave', onPaintEnd);
    window.addEventListener('pointerup', onPaintEnd);
    window.addEventListener('resize', function () { layoutHand(); });
    document.addEventListener('keydown', function (ev) {
      var tag = ev.target && ev.target.tagName;
      if (tag === 'BUTTON' && (ev.key === ' ' || ev.key === 'Enter')) return;
      if (ev.key === ' ' || ev.key === 'Spacebar') { ev.preventDefault(); doPlay(); }
      else if (ev.key === 'Escape' || ev.key === 'Backspace') { ev.preventDefault(); doPass(); }
      else if (ev.key === 'h' || ev.key === 'H') doHint();
      else if (ev.key === 's' || ev.key === 'S') doSort();
      else if (ev.key === 'a' || ev.key === 'A') toggleAuto();
      else if (ev.key === 'r' || ev.key === 'R') onReveal();
    });
  }

  loadStats();
  bind();
  newGame();
})();
</script>
</body>
</html>
